<svg xmlns="http://www.w3.org/2000/svg" width="680" height="852" viewBox="0 0 680 852">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<rect width="680" height="852" fill="#FFFFFF"/>
<rect x="40" y="30" width="300" height="78" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="190.0" y="56.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">Group nearby objects</text>
<text x="190.0" y="76.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle">Objects whose regions overlap go</text>
<text x="190.0" y="92.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle">together</text>
<rect x="40" y="134" width="300" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="190.0" y="161.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">Pick the region around each group</text>
<path d="M 190.0 108 L 190.0 132" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="40" y="204" width="300" height="402" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/>
<text x="190.0" y="228" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">Repeat a few rounds (4 by default)</text>
<rect x="56" y="244" width="268" height="96" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="190.0" y="270.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">Fit each object's shape across</text>
<text x="190.0" y="288.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">the slit</text>
<text x="190.0" y="308.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle">First round starts from a simple</text>
<text x="190.0" y="324.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle">box sum</text>
<rect x="56" y="362" width="268" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="190.0" y="388.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">Choose where the sky model can</text>
<text x="190.0" y="406.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">bend</text>
<rect x="56" y="444" width="268" height="62" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="190.0" y="470.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">Fit sky and objects together</text>
<text x="190.0" y="490.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle">Separates overlapping sources</text>
<rect x="56" y="528" width="268" height="62" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="190.0" y="554.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">Update the noise estimate</text>
<text x="190.0" y="574.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle">Uses the new sky model</text>
<path d="M 190.0 340 L 190.0 360" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M 190.0 422 L 190.0 442" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M 190.0 506 L 190.0 526" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M 190.0 178 L 190.0 202" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="40" y="632" width="300" height="78" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="190.0" y="658.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">Final extraction</text>
<text x="190.0" y="678.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle">Optimal (standard Horne method) and</text>
<text x="190.0" y="694.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="middle">boxcar (simple sum)</text>
<path d="M 190.0 606 L 190.0 630" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="40" y="760" width="140" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="110.0" y="786.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle">Spec1D</text>
<text x="110.0" y="806.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="middle">1D spectra</text>
<rect x="200" y="760" width="140" height="62" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="270.0" y="786.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#4A1B0C" text-anchor="middle">Spec2D</text>
<text x="270.0" y="806.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="middle">2D images</text>
<path d="M 190.0 710 L 110.0 758" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M 190.0 710 L 270.0 758" fill="none" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="400" y="369.0" width="240" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/>
<text x="520.0" y="393.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">Optional: turn off local sky</text>
<text x="520.0" y="409.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">subtraction for very extended,</text>
<text x="520.0" y="425.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">bright emission lines</text>
<path d="M 340 405.0 L 398 405.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="4 3"/>
<rect x="400" y="627.0" width="240" height="88" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/>
<text x="520.0" y="651.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">Optional: keep pixels that look</text>
<text x="520.0" y="667.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">different from the continuum</text>
<text x="520.0" y="683.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">(bright emission lines) instead</text>
<text x="520.0" y="699.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">of rejecting them</text>
<path d="M 340 671.0 L 398 671.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="4 3"/>
</svg>